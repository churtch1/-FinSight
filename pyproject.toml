[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-mvp"
version = "0.1.0"
description = "Personal portfolio management MVP with Supabase, Streamlit, CSV/PDF imports, and IBKR sync."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.35",
  "pandas>=2.0",
  "plotly>=5.20",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "supabase>=2.4",
  "pypdf>=4.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
norecursedirs = [
  ".git",
  ".pytest_cache",
  ".codex_demo_publish",
  "pytest-cache-files-*",
]

